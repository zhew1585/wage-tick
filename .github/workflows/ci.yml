# 每个 PR 与 main 的提交：跑核心测试，编一次 App (Debug)，确保能发布。
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 测试与编译
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 选 Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: 核心测试
        run: swift test --package-path WageCore
      - name: 拉取依赖
        # SwiftPM 下载 Sparkle 二进制包偶尔会撞上 runner 缓存里的残留 (「already exists in file system」)，清掉缓存重试。
        run: |
          for attempt in 1 2 3; do
            rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts
            xcodebuild -resolvePackageDependencies -project WageTick.xcodeproj -scheme WageTick -derivedDataPath build/ci && break
            [[ $attempt == 3 ]] && exit 1
            sleep 10
          done

      - name: 编译 App
        run: |
          xcodebuild -project WageTick.xcodeproj -scheme WageTick -configuration Debug \
            -derivedDataPath build/ci -destination "generic/platform=macOS" build -quiet
