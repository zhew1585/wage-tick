# 每个 PR 与 main 的提交 (ADR-0008)：两项检查都通过才能合进 main。
# - 核心测试：WageCore 的全部单元测试，覆盖工资计算与界面文字。
# - App 编译与启动：按发布的方式编 Release，再真的启动一次，确认签名、框架、小组件扩展都在、App 能跑起来。
# 两个 job 的 name 是分支保护里的必需检查名，改名要同步改仓库的 ruleset。
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 核心测试
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 选 Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: 核心测试
        run: swift test --package-path WageCore

  app:
    name: App 编译与启动
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 选 Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm/artifacts
          key: spm-artifacts-${{ hashFiles('WageTick.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: 拉取依赖
        # Sparkle 是二进制包，要从 GitHub Release 下载；GitHub 下载超时 (504) 时 xcodebuild 会误报「already exists in file system」。
        # 成功下载过一次后由上一步的缓存提供，不再依赖 GitHub 下载；没命中缓存时隔 30、60 秒重试。
        run: |
          for wait in 30 60 0; do
            xcodebuild -resolvePackageDependencies -project WageTick.xcodeproj -scheme WageTick -derivedDataPath build/ci && break
            [[ $wait == 0 ]] && exit 1
            sleep $wait
          done

      - name: 编译 Release
        # 和 release.yml 一样的配置与签名，发布时会出的问题在这里就能发现。
        run: |
          xcodebuild -project WageTick.xcodeproj -scheme WageTick -configuration Release \
            -derivedDataPath build/ci -destination "generic/platform=macOS" build -quiet

      - name: 启动检查
        run: scripts/ci/smoke-test.sh "build/ci/Build/Products/Release/牛马鼓励器.app"
